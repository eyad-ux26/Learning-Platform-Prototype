name: Deploy prototype to GitHub Pages

on:
  push:
    branches: [claude/focused-rubin-ug2jwz]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Tries to switch Pages on with "GitHub Actions" as the source. If the token
      # isn't allowed to, enable it once in Settings → Pages → Source: GitHub Actions.
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - run: npm ci
      - run: npm test
      - run: npm run build:pages
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
